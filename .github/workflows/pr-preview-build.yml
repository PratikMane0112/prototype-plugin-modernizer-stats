name: Build PR Preview

on:
  workflow_run:
    workflows: ['CI']
    types:
      - completed
  pull_request:
    types:
      - closed
    branches: [master]
  workflow_dispatch:
    inputs:
      pr-number:
        description: 'PR number to build and deploy preview for'
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read
  actions: read

concurrency:
  group: >-
    preview-build-${{
      github.event_name == 'workflow_dispatch' && inputs.pr-number ||
      github.event_name == 'pull_request' && github.event.number ||
      format('{0}-{1}',
        github.event.workflow_run.head_repository.full_name,
        github.event.workflow_run.head_branch)
    }}
  cancel-in-progress: true

jobs:
  build-preview:
    if: >
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
      (github.event_name == 'pull_request' && github.event.action == 'closed') ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      # ──────────────────────────────────────────────────────────────────
      # STEP 1: Determine PR number
      # ──────────────────────────────────────────────────────────────────
      # FIX for fork PRs: workflow_run.pull_requests[] is ALWAYS empty
      # for cross-repository (fork) PRs. PR #94 used pulls.list() with
      # head: "full_name:branch" but full_name = "owner/repo" while the
      # API expects "owner:branch" — so it never matched fork PRs.
      #
      # Enhanced approach:
      #   1. Try workflow_run.pull_requests[] (works for same-repo PRs)
      #   2. Fallback: listPullRequestsAssociatedWithCommit() using the
      #      head_sha — this works for BOTH same-repo AND fork PRs
      #   3. Last resort: pulls.list() with corrected head format using
      #      head_repository.owner.login (not full_name)
      # ──────────────────────────────────────────────────────────────────
      - name: Get PR number from workflow run
        if: github.event_name == 'workflow_run'
        uses: actions/github-script@v7
        id: pr-info-wr
        with:
          script: |
            const headSha = context.payload.workflow_run.head_sha;
            const headBranch = context.payload.workflow_run.head_branch;
            const headRepoFullName = context.payload.workflow_run.head_repository.full_name;
            const headRepoOwner = context.payload.workflow_run.head_repository.owner.login;
            const isFork = headRepoFullName !== `${context.repo.owner}/${context.repo.repo}`;

            console.log(`Head SHA: ${headSha}`);
            console.log(`Head branch: ${headBranch}`);
            console.log(`Head repo: ${headRepoFullName}`);
            console.log(`Is fork PR: ${isFork}`);

            // Strategy 1: Use workflow_run.pull_requests (only works for same-repo PRs)
            const prs = context.payload.workflow_run.pull_requests;
            if (prs && prs.length > 0) {
              const prNumber = prs[0].number.toString();
              console.log(`✅ Found PR #${prNumber} from workflow_run.pull_requests`);
              core.setOutput('pr-number', prNumber);
              return;
            }
            console.log('ℹ️  workflow_run.pull_requests is empty (expected for fork PRs)');

            // Strategy 2: Find PR by commit SHA (works for BOTH same-repo AND fork PRs)
            try {
              const { data: commitPRs } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
                owner: context.repo.owner,
                repo: context.repo.repo,
                commit_sha: headSha,
              });

              const openPR = commitPRs.find(pr => pr.state === 'open');
              if (openPR) {
                const prNumber = openPR.number.toString();
                console.log(`✅ Found PR #${prNumber} via commit SHA association`);
                core.setOutput('pr-number', prNumber);
                return;
              }
              console.log(`ℹ️  No open PR found for commit SHA ${headSha}`);
            } catch (error) {
              console.log(`⚠️  listPullRequestsAssociatedWithCommit failed: ${error.message}`);
            }

            // Strategy 3: Search by head branch with CORRECT format "owner:branch"
            // BUG FIX: PR #94 used head_repository.full_name ("owner/repo") but
            // the GitHub API expects just "owner" in the head parameter
            try {
              const headParam = `${headRepoOwner}:${headBranch}`;
              console.log(`Searching PRs with head: ${headParam}`);

              const { data: pulls } = await github.rest.pulls.list({
                owner: context.repo.owner,
                repo: context.repo.repo,
                head: headParam,
                state: 'open',
              });

              if (pulls.length > 0) {
                const prNumber = pulls[0].number.toString();
                console.log(`✅ Found PR #${prNumber} via pulls.list head search`);
                core.setOutput('pr-number', prNumber);
                return;
              }
              console.log(`ℹ️  No open PR found with head: ${headParam}`);
            } catch (error) {
              console.log(`⚠️  pulls.list search failed: ${error.message}`);
            }

            core.setFailed(
              `❌ Could not find an open PR for workflow run.\n` +
              `  Head SHA: ${headSha}\n` +
              `  Head branch: ${headBranch}\n` +
              `  Head repo: ${headRepoFullName}\n` +
              `  Is fork: ${isFork}`
            );

      - name: Set PR metadata
        id: pr-info
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "pr-number=${{ github.event.number }}" >> "$GITHUB_OUTPUT"
            echo "pr-action=closed" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "pr-number=${{ inputs.pr-number }}" >> "$GITHUB_OUTPUT"
            echo "pr-action=deploy" >> "$GITHUB_OUTPUT"
          else
            echo "pr-number=${{ steps.pr-info-wr.outputs.pr-number }}" >> "$GITHUB_OUTPUT"
            echo "pr-action=deploy" >> "$GITHUB_OUTPUT"
          fi

      # ──────────────────────────────────────────────────────────────────
      # STEP 2: Build the preview
      # Uses refs/pull/N/head to checkout the PR merge ref — this is
      # safe because this workflow has read-only permissions and never
      # exposes secrets to fork-provided code.
      # ──────────────────────────────────────────────────────────────────
      - name: Checkout PR code
        if: steps.pr-info.outputs.pr-action != 'closed'
        uses: actions/checkout@v7
        with:
          ref: refs/pull/${{ steps.pr-info.outputs.pr-number }}/head
          # Safe to opt in: this workflow has read-only permissions, no
          # secrets are passed to build steps, and the deploy workflow
          # (which has write access) never executes fork-provided code.
          allow-unsafe-pr-checkout: true

      - name: Setup Node.js
        if: steps.pr-info.outputs.pr-action != 'closed'
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        if: steps.pr-info.outputs.pr-action != 'closed'
        run: npm ci

      - name: Fetch metadata
        if: steps.pr-info.outputs.pr-action != 'closed'
        run: npm run fetch-metadata

      - name: Build for preview
        if: steps.pr-info.outputs.pr-action != 'closed'
        run: |
          npx tsc -b
          npx vite build --base /${{ github.event.repository.name }}/pr-preview/pr-${{ steps.pr-info.outputs.pr-number }}/
          cp dist/index.html dist/404.html

      # ──────────────────────────────────────────────────────────────────
      # STEP 3: Upload artifacts for the deploy workflow
      # Metadata is passed via artifacts (not shell variables) to prevent
      # injection attacks from fork PR code.
      # ──────────────────────────────────────────────────────────────────
      - name: Upload build artifact
        if: steps.pr-info.outputs.pr-action != 'closed'
        uses: actions/upload-artifact@v4
        with:
          name: pr-preview-build
          path: dist/
          if-no-files-found: error

      - name: Save PR metadata
        run: |
          mkdir -p pr-metadata
          echo "${{ steps.pr-info.outputs.pr-number }}" > pr-metadata/pr-number
          echo "${{ steps.pr-info.outputs.pr-action }}" > pr-metadata/pr-action
          if [ "${{ steps.pr-info.outputs.pr-action }}" != "closed" ]; then
            git rev-parse HEAD > pr-metadata/pr-head-sha
            git log -1 --format='%s' | head -c 200 > pr-metadata/pr-commit-message
          fi

      - name: Upload PR metadata
        uses: actions/upload-artifact@v4
        with:
          name: pr-metadata
          path: pr-metadata/
          if-no-files-found: error
