name: Deploy PR Preview

on:
  workflow_run:
    workflows: ['Build PR Preview']
    types:
      - completed

permissions:
  actions: read
  contents: write
  pull-requests: write

concurrency:
  group: preview-deploy-${{ github.event.workflow_run.id }}
  cancel-in-progress: true

jobs:
  deploy-preview:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # ──────────────────────────────────────────────────────────────────
      # Download artifacts from the build run.
      # This workflow runs with write permissions but NEVER executes any
      # code from the PR — it only deploys pre-built static artifacts.
      # This is the security boundary that makes the workflow_run split
      # safe for fork PRs.
      # ──────────────────────────────────────────────────────────────────
      - name: Download artifacts from build run
        uses: actions/github-script@v7
        with:
          script: |
            const runId = context.payload.workflow_run.id;
            console.log(`Downloading artifacts from workflow run ${runId}`);

            const { data: { artifacts } } = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: runId,
            });

            console.log(`Found ${artifacts.length} artifact(s):`);
            artifacts.forEach(a => console.log(`  - ${a.name} (id: ${a.id}, size: ${a.size_in_bytes})`));

            for (const name of ['pr-metadata', 'pr-preview-build']) {
              const match = artifacts.find(a => a.name === name);
              if (!match) {
                if (name === 'pr-preview-build') {
                  console.log(`Artifact '${name}' not found (may be a closed PR cleanup)`);
                  continue;
                }
                core.setFailed(`Required artifact '${name}' not found in run ${runId}`);
                return;
              }

              const download = await github.rest.actions.downloadArtifact({
                owner: context.repo.owner,
                repo: context.repo.repo,
                artifact_id: match.id,
                archive_format: 'zip',
              });

              const fs = require('fs');
              fs.writeFileSync(`${process.env.GITHUB_WORKSPACE}/${name}.zip`, Buffer.from(download.data));
              console.log(`Downloaded ${name}.zip`);
            }

      - name: Unzip artifacts
        run: |
          mkdir -p pr-metadata
          unzip -o pr-metadata.zip -d pr-metadata
          if [ -f pr-preview-build.zip ]; then
            mkdir -p dist
            unzip -o pr-preview-build.zip -d dist
          fi

      - name: Read PR metadata
        id: pr-info
        run: |
          PR_NUMBER="$(cat pr-metadata/pr-number)"
          PR_ACTION="$(cat pr-metadata/pr-action)"
          echo "pr-number=${PR_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "pr-action=${PR_ACTION}" >> "$GITHUB_OUTPUT"

          if [ -f pr-metadata/pr-head-sha ]; then
            echo "pr-head-sha=$(cat pr-metadata/pr-head-sha)" >> "$GITHUB_OUTPUT"
          fi
          if [ -f pr-metadata/pr-commit-message ]; then
            # Sanitize commit message to prevent markdown/script injection in PR comments
            SANITIZED_MSG="$(cat pr-metadata/pr-commit-message | tr -d '|`$' | head -c 200)"
            echo "pr-commit-message=${SANITIZED_MSG}" >> "$GITHUB_OUTPUT"
          fi

          echo "PR #${PR_NUMBER}, action: ${PR_ACTION}"

      # ──────────────────────────────────────────────────────────────────
      # Deploy or remove preview
      # ──────────────────────────────────────────────────────────────────
      - name: Deploy preview
        if: steps.pr-info.outputs.pr-action == 'deploy'
        id: deploy-preview
        uses: rossjrw/pr-preview-action@873417d2df72380da1f3978378fb58560bcde976 # v1.8.2
        with:
          source-dir: ./dist/
          preview-branch: gh-pages
          umbrella-dir: pr-preview
          pr-number: ${{ steps.pr-info.outputs.pr-number }}
          action: deploy
          comment: false

      # Workaround: pr-preview-action's built-in comment does not work under
      # workflow_run because it never forwards pr-number to sticky-pull-request-comment.
      # See: https://github.com/rossjrw/pr-preview-action/pull/131
      - name: Comment preview URL on PR
        if: steps.pr-info.outputs.pr-action == 'deploy'
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: pr-preview
          number: ${{ steps.pr-info.outputs.pr-number }}
          message: |
            <div align="center">
            <picture><img src="https://www.jenkins.io/images/logos/jenkins/jenkins.svg" width="42" alt="Jenkins"></picture>
            <h3>Plugin Modernizer Stats — PR Preview</h3>
            </div>

            ---

            | | |
            | :--- | :--- |
            | **Status** | :white_check_mark: Preview deployed successfully! |
            | **Preview URL** | ${{ steps.deploy-preview.outputs.preview-url }} :rocket: |
            | **Commit** | `${{ steps.pr-info.outputs.pr-head-sha }}` |
            | **Message** | ${{ steps.pr-info.outputs.pr-commit-message }} |

            ---

            > :hourglass: _This preview is automatically updated on each commit push..._

      - name: Remove preview
        if: steps.pr-info.outputs.pr-action == 'merged' || steps.pr-info.outputs.pr-action == 'closed'
        uses: rossjrw/pr-preview-action@873417d2df72380da1f3978378fb58560bcde976 # v1.8.2
        with:
          preview-branch: gh-pages
          umbrella-dir: pr-preview
          pr-number: ${{ steps.pr-info.outputs.pr-number }}
          action: remove
          comment: false

      - name: Comment preview removed (PR merged)
        if: steps.pr-info.outputs.pr-action == 'merged'
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: pr-preview
          number: ${{ steps.pr-info.outputs.pr-number }}
          message: |
            <div align="center">
            <picture><img src="https://www.jenkins.io/images/logos/jenkins/jenkins.svg" width="42" alt="Jenkins"></picture>
            <h3>Plugin Modernizer Stats — PR Preview</h3>
            </div>

            ---

            | | |
            | :--- | :--- |
            | **Status** | :purple_heart: Preview removed — PR merged successfully! |

            ---

            > :tada: _Changes are now live on the production site._

      - name: Comment preview removed (PR closed)
        if: steps.pr-info.outputs.pr-action == 'closed'
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: pr-preview
          number: ${{ steps.pr-info.outputs.pr-number }}
          message: |
            <div align="center">
            <picture><img src="https://www.jenkins.io/images/logos/jenkins/jenkins.svg" width="42" alt="Jenkins"></picture>
            <h3>Plugin Modernizer Stats — PR Preview</h3>
            </div>

            ---

            | | |
            | :--- | :--- |
            | **Status** | :wastebasket: Preview removed |

            ---

            > :wastebasket: _The preview for this PR has been cleaned up because the pull request was closed without merging._
